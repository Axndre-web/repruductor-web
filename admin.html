<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON PLAYER X · Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><div class="store-hero"><div><span class="eyebrow">PANEL PRIVADO LOCAL</span><h2>ADMIN <span>PEDIDOS</span></h2><p>Pedidos guardados en este navegador.</p></div><a class="neon-cta" href="index.html">← VOLVER</a></div><section class="library-card"><div class="section-header"><h2>Pedidos</h2><button class="danger-small" style="width:auto;padding:8px 12px" id="clear">Borrar todos</button></div><div id="orders" class="special-grid"></div></section></div><script>
const e=x=>{const d=document.createElement("div");d.textContent=x;return d.innerHTML};
function render(){const a=JSON.parse(localStorage.getItem("neonOrders")||"[]");document.querySelector("#orders").innerHTML=a.length?a.map((o,i)=>`<article class="media-tile"><div class="tile-icon">${o.status==="Pagado"?"💳":"📦"}</div><div class="tile-title">${e(o.name||"Sin nombre")}</div><div class="tile-meta">${e(o.phone||"")} · ${e(o.date||"")} ${e(o.time||"")}<br>${o.delivery==="home"?"🏠 "+e(o.address||""):"🚉 Recogida Renfe Azuqueca"}<br><b>${Number(o.total||0).toFixed(2)} €</b> · ${e(o.status||"Nuevo")}</div><button class="tile-btn" onclick="navigator.clipboard.writeText(${JSON.stringify(JSON.stringify(o,null,2))})">COPIAR</button></article>`).join(""):"<div class='empty-list'>No hay pedidos guardados.</div>"}
document.querySelector("#clear").onclick=()=>{if(confirm("¿Borrar todos los pedidos?")){localStorage.removeItem("neonOrders");render()}};render();
</script></body></html>
