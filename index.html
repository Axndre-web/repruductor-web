<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Media Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <header class="topbar">
            <div>
                <span class="eyebrow">MULTIMEDIA</span>
                <h1>NEON<span>PLAYER</span></h1>
            </div>

            <label class="upload-btn">
                📁 Cargar archivos
                <input type="file" id="fileInput"
                       accept="audio/*,video/*"
                       multiple hidden>
            </label>
        </header>

        <section class="player-layout">

            <section class="player-card">

                <div class="media-container" id="mediaContainer">

                    <div class="empty-state" id="emptyState">
                        <div class="neon-icon">▶</div>
                        <h2>NEON PLAYER</h2>
                        <p>Carga un archivo multimedia para comenzar</p>
                    </div>

                    <video id="videoPlayer" controlsList="nodownload">
                    </video>

                    <audio id="audioPlayer">
                    </audio>

                    <button class="fullscreen-btn" id="fullscreenBtn"
                            title="Pantalla completa">
                        ⛶
                    </button>
                </div>

                <div class="media-info">
                    <div>
                        <span class="label">REPRODUCIENDO</span>
                        <h2 id="currentTitle">Ningún archivo seleccionado</h2>
                    </div>

                    <div class="type-badge" id="mediaType">---</div>
                </div>

                <div class="progress-area">
                    <span id="currentTime">00:00</span>

                    <input type="range"
                           id="progress"
                           min="0"
                           max="100"
                           value="0">

                    <span id="duration">00:00</span>
                </div>

                <div class="controls">

                    <button id="backBtn" class="control-btn" title="Retroceder 10 segundos">
                        ⏪
                    </button>

                    <button id="playBtn" class="play-btn" title="Reproducir">
                        ▶
                    </button>

                    <button id="forwardBtn" class="control-btn" title="Avanzar 10 segundos">
                        ⏩
                    </button>

                </div>

                <div class="volume-area">
                    <button id="muteBtn" class="small-btn">🔊</button>

                    <input type="range"
                           id="volume"
                           min="0"
                           max="1"
                           step="0.01"
                           value="1">

                    <span id="volumeValue">100%</span>
                </div>

            </section>

            <aside class="playlist-card">

                <div class="playlist-header">
                    <div>
                        <span class="eyebrow">COLECCIÓN</span>
                        <h2>Playlist</h2>
                    </div>

                    <span class="track-count" id="trackCount">0</span>
                </div>

                <div id="playlist" class="playlist">
                    <div class="playlist-empty">
                        <span>🎵</span>
                        <p>Tu lista está vacía</p>
                        <small>Carga archivos para añadirlos</small>
                    </div>
                </div>

                <button id="clearPlaylist" class="clear-btn">
                    🗑 Vaciar playlist
                </button>

            </aside>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
