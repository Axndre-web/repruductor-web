<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05050a">
    <title>Neon Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <header class="topbar">
        <div class="brand">
            <span class="eyebrow">MULTIMEDIA</span>
            <h1>NEON<span>PLAYER</span></h1>
        </div>

        <label class="upload-btn">
            📁 Cargar
            <input id="fileInput" type="file"
                   accept="audio/*,video/*" multiple hidden>
        </label>
    </header>


    <section class="main-grid">

        <section class="player-card">

            <div class="media-container" id="mediaContainer">

                <div class="empty-state" id="emptyState">
                    <div class="neon-icon">▶</div>
                    <h2>NEON PLAYER</h2>
                    <p>Selecciona una canción o vídeo</p>
                </div>

                <video id="videoPlayer"></video>
                <audio id="audioPlayer"></audio>

                <div class="sound-waves"></div>

                <button id="fullscreenBtn"
                        class="fullscreen-btn">
                    ⛶
                </button>

            </div>


            <div class="media-info">

                <div class="now-playing">
                    <span class="label">REPRODUCIENDO</span>
                    <h2 id="currentTitle">
                        Ningún archivo seleccionado
                    </h2>
                </div>

                <span id="mediaType" class="type-badge">---</span>

            </div>


            <div class="progress-area">
                <span id="currentTime">00:00</span>

                <input id="progress"
                       type="range"
                       min="0"
                       max="100"
                       value="0">

                <span id="duration">00:00</span>
            </div>


            <div class="controls">

                <button id="backBtn"
                        class="control-btn">
                    ⏪
                </button>

                <button id="playBtn"
                        class="play-btn">
                    ▶
                </button>

                <button id="forwardBtn"
                        class="control-btn">
                    ⏩
                </button>

            </div>


            <div class="volume-area">

                <button id="muteBtn"
                        class="small-btn">
                    🔊
                </button>

                <input id="volume"
                       type="range"
                       min="0"
                       max="1"
                       step="0.01"
                       value="1">

                <span id="volumeValue">100%</span>

            </div>

        </section>


        <aside class="playlist-card">

            <div class="section-header">

                <div>
                    <span class="eyebrow">COLECCIÓN</span>
                    <h2>Mi Playlist</h2>
                </div>

                <span id="trackCount"
                      class="count">0</span>

            </div>

            <div id="playlist"
                 class="playlist"></div>

            <button id="clearPlaylist"
                    class="clear-btn">
                🗑 Vaciar
            </button>

        </aside>

    </section>


    <section class="library-card">

        <div class="section-header">

            <div>
                <span class="eyebrow">
                    BIBLIOTECA PERSONAL
                </span>

                <h2>⭐ Mi Música</h2>
            </div>

            <span class="count">25</span>

        </div>

        <div id="myMusicList"
             class="music-grid"></div>

    </section>


    <section class="radio-card">

        <div class="section-header">

            <div>
                <span class="eyebrow">
                    EMISIÓN ONLINE
                </span>

                <h2>📻 Neon Radio</h2>
            </div>

            <span id="radioStatus"
                  class="radio-status">
                OFFLINE
            </span>

        </div>


        <div class="radio-player">

            <div class="radio-info">

                <div class="radio-icon">
                    📻
                </div>

                <div>
                    <span class="label">EMISORA</span>

                    <h3 id="radioName">
                        Selecciona una emisora
                    </h3>

                    <span id="radioGenre">
                        Radio online
                    </span>
                </div>

            </div>


            <div class="radio-controls">

                <button id="radioPlay"
                        class="radio-play">
                    ▶
                </button>

                <input id="radioVolume"
                       type="range"
                       min="0"
                       max="1"
                       step="0.01"
                       value="1">

                <span id="radioVolumeValue">
                    100%
                </span>

            </div>

        </div>


        <div class="radio-filters">

            <button class="radio-filter active"
                    data-filter="all">
                Todas
            </button>

            <button class="radio-filter"
                    data-filter="España">
                🇪🇸 España
            </button>

            <button class="radio-filter"
                    data-filter="Europa">
                🇪🇺 Europa
            </button>

            <button class="radio-filter"
                    data-filter="Latinoamérica">
                🌎 Latinoamérica
            </button>

            <button class="radio-filter"
                    data-filter="Música">
                🎵 Música
            </button>

        </div>


        <div id="radioList"
             class="radio-grid"></div>

    </section>

</main>


<audio id="radioAudio"
       preload="none"></audio>

<script src="script.js"></script>

</body>
</html>
